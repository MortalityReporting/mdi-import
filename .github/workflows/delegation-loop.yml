name: Delegation loop

on:
  push:
    paths:
      - "import-templates/**"
      - "src/**"
      - "tests/**"
      - "*.md"
      - "**/*.md"
      - "*.sln"
      - "*.csproj"
      - "tools/**"
      - ".github/workflows/delegation-loop.yml"
  pull_request:
    paths:
      - "import-templates/**"
      - "src/**"
      - "tests/**"
      - "*.md"
      - "**/*.md"
      - "*.sln"
      - "*.csproj"
      - "tools/**"
      - ".github/workflows/delegation-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegate:
    name: Run delegated validation loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Execute delegation loop
        run: ./tools/delegation-loop.sh --all
